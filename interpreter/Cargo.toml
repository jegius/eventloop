[package]
name = "js-eventloop-interpreter"
version = "0.1.0"
edition = "2021"
description = "Интерпретатор JavaScript с реализацией Event Loop по стандарту ECMAScript 2026"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1